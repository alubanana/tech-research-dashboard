<script>

const ICONS={worlds:'<path d="m3 6 7-4 7 4v9l-7 4-7-4Z"/><path d="m3 6 7 4 7-4M10 10v9"/>',robots:'<rect x="3" y="6" width="14" height="11" rx="3"/><path d="M10 3v3M6 10h1m6 0h1M7 14h6"/>',editing:'<path d="M5 2c0 8 10 8 10 16M15 2C15 10 5 10 5 18M6 4h8M7 8h6M7 12h6M6 16h8"/>',spatial:'<path d="M2 8h16v6H2Zm0 0 2-3m14 3-2-3M8 8v6m4-6v6"/>',bci:'<path d="M6 16a5 5 0 0 1-2-9 4 4 0 0 1 6-4 4 4 0 0 1 6 4 5 5 0 0 1-2 9M10 3v15M5 9l3 2m7-2-3 2"/>',organs:'<path d="M10 6C7 0 1 4 3 10c1 4 5 7 7 8 2-1 6-4 7-8 2-6-4-10-7-4Z"/>',labs:'<path d="M7 2h6m-5 0v6l-5 8q-1 2 2 2h10q3 0 2-2l-5-8V2M6 12h8"/>',tandem:'<path d="m4 6 12 0 2 10H2Zm1 5h10M8 6l-1 10m5-10 1 10M10 2v1M3 3l1 1m12 0 1-1"/>',storage:'<rect x="3" y="4" width="13" height="13" rx="2"/><path d="M7 2h5M17 9h1v3h-1M11 7l-3 4h4l-3 4"/>',fusion:'<ellipse cx="10" cy="10" rx="8" ry="3"/><ellipse cx="10" cy="10" rx="8" ry="3" transform="rotate(60 10 10)"/><ellipse cx="10" cy="10" rx="8" ry="3" transform="rotate(120 10 10)"/>'};

function overview(ds){
 const order=Object.keys(PRESENTATION.directions),ordered=ds.slice().sort((a,b)=>Number(!!display(b).priority)-Number(!!display(a).priority)||order.indexOf(a.id)-order.indexOf(b.id));
 if(state.homeDirection&&!ds.some(d=>d.id===state.homeDirection))state.homeDirection='';
 const active=DATA.directions.find(d=>d.id===state.homeDirection),visible=state.homeDirection?ds.filter(d=>d.id===state.homeDirection):ds;
 const matches=c=>c.directions.some(id=>visible.some(d=>d.id===id))&&(!state.q||homeCompanySearch(c)||c.directions.some(id=>visible.some(d=>d.id===id&&(d.name.toLowerCase().includes(state.q.toLowerCase())||display(d).short.toLowerCase().includes(state.q.toLowerCase())))))&&(!state.favorites||saved.includes('company:'+c.id)||c.directions.some(id=>saved.includes(id)));
 const cs=COMPANIES.filter(matches).sort((a,b)=>Math.min(...a.directions.map(id=>ordered.findIndex(d=>d.id===id)).filter(i=>i>=0))-Math.min(...b.directions.map(id=>ordered.findIndex(d=>d.id===id)).filter(i=>i>=0)));
 const rail=ordered.map(d=>{const pr=display(d);return '<div class="direction-switch '+(d.id===state.homeDirection?'selected':'')+'"><button class="direction-pick" data-home-direction="'+esc(d.id)+'" aria-label="筛选'+esc(pr.short)+'公司" aria-pressed="'+(d.id===state.homeDirection)+'"><span class="rail-name">'+icon(d.id)+esc(pr.short)+(pr.priority?'<i class="priority-dot" title="优先研究"></i>':'')+'</span><span class="rail-stage">'+esc(d.stage)+'</span><span class="mini-track" role="img" aria-label="'+esc(pr.short)+'：'+PHASES[pr.checkpoint]+'" title="'+PHASES.join(' → ')+'">'+PHASES.map((s,i)=>'<i class="'+(i<pr.checkpoint?'done':i===pr.checkpoint?'current':'')+'"></i>').join('')+'</span></button><button class="rail-detail" data-detail="'+esc(d.id)+'" aria-label="查看'+esc(pr.short)+'技术详情">↗</button></div>';}).join('');
 const rows=cs.map(c=>{const s=PRESENTATION.companies?.[c.id]||{founders:c.founders,round:c.capital.event,investors:c.capital.investors},v=c.valuation;return '<tr><td><div class="home-company-name">'+companyButton(c)+starCompany(c)+'</div><div class="cell-sub">'+c.directions.map(id=>esc(display(DATA.directions.find(d=>d.id===id)).short)).join(' · ')+'</div></td><td title="'+esc(c.founders)+'">'+esc(s.founders)+'</td><td><a class="home-value '+(/媒体/.test(v.status)?'reported':'')+'" href="'+esc(v.url)+'" target="_blank" rel="noopener noreferrer">'+esc(v.amount)+'</a><div class="cell-sub">'+esc(v.basis)+'</div>'+(/媒体|未确认/.test(v.status)?'<div class="valuation-state">'+esc(v.status)+'</div>':'')+(v.date?'<time>'+esc(v.date)+'</time>':'')+'</td><td><strong>'+esc(s.round)+'</strong><div class="cell-sub">'+esc(c.capital.amount)+'</div>'+(s.roundNote?'<div class="cell-sub">'+esc(s.roundNote)+'</div>':'')+(s.dateLabel||c.capital.date?'<time>'+esc(s.dateLabel||c.capital.date)+'</time>':'')+'</td><td>'+esc(s.investors)+(s.investorNote?'<div class="cell-sub">'+esc(s.investorNote)+'</div>':'')+'</td></tr>';}).join('');
 const readings=PRESENTATION.readings.filter(r=>visible.some(d=>d.id===r.direction));
 return homeOdds()+'<div class="home-dashboard"><aside class="direction-rail"><div class="panel-top"><h2>方向与阶段</h2><button class="home-reset '+(!active?'active':'')+'" data-home-direction="" aria-pressed="'+!active+'">全部</button></div><div class="rail-axis"><span>方向</span><span title="'+PHASES.join(' → ')+'">研究 · 验证 · 使用 · 普及</span></div>'+rail+'<div class="rail-foot"><span>技术核查 '+esc(DATA.checkedAt)+'</span><button data-view="framework">研究标准 ↗</button></div></aside><div class="home-main"><div class="panel-top"><h2>'+(active?esc(display(active).short)+' · ':'')+'公司<span class="section-count">'+cs.length+'</span></h2><span class="home-date">公司核查 '+esc(DATA.companyData.checkedAt)+'</span></div><div class="home-table-scroll"><table class="home-company-table"><thead><tr><th>公司</th><th>创始人</th><th>估值</th><th>轮次／资本节点</th><th>核心投资方</th></tr></thead><tbody>'+rows+'</tbody></table>'+(!cs.length?'<div class="empty">暂无对应公司</div>':'')+'</div></div></div>'+(readings.length?'<section class="home-readings"><h2>数据</h2><div>'+readings.map(r=>'<button data-detail="'+esc(r.direction)+'" aria-label="查看'+esc(r.label)+'详情"><span class="home-reading-value">'+esc(r.value)+'<small>'+esc(r.unit)+'</small></span><span><strong>'+esc(r.label)+'</strong><span class="cell-sub">'+esc(r.context)+' · '+esc(r.date)+'</span></span></button>').join('')+'</div></section>':'');
}
function framework(){return '<div class="framework"><div class="frame"><h2>研究阶段</h2>'+[['技术验证','明确条件下的能力与重复性'],['工程验证','成本、寿命、可靠性与量产'],['实际使用','使用频率、付费与替代行为'],['规模采用','采用范围、制度与组织变化']].map((x,i)=>'<div class="step"><em>0'+(i+1)+'</em><div><strong>'+x[0]+'</strong><span>'+x[1]+'</span></div></div>').join('')+'</div><div class="frame"><h2>核查项目</h2><table class="matrix"><thead><tr><th>来源</th><th>核查内容</th></tr></thead><tbody><tr><td>论文与基准</td><td>比较对象、样本、限制、独立复现</td></tr><tr><td>产品演示</td><td>人工介入、测试条件、失败次数与总次数</td></tr><tr><td>实际使用</td><td>复用、付费、流失与替代行为</td></tr><tr><td>失败与反证</td><td>安全暂停、寿命、成本与需求</td></tr></tbody></table></div></div>';}
function render(){const ds=selected();$('#tools').style.display=state.view==='framework'?'none':'flex';let html='';if(state.view==='framework')html=framework();else if(!ds.length)html='<div class="empty">没有匹配的记录</div>';else if(state.view==='directions')html=overview(ds);else if(state.view==='events'){const ev=ds.flatMap(d=>d.signals.map(s=>({...s,d}))).sort((a,b)=>b.date.localeCompare(a.date));html=ev.map(s=>'<article class="event"><span class="date">'+esc(s.date)+'</span><div><div class="event-head"><span class="category">'+esc(s.d.name)+'</span>'+pill(s.evidence,/暂停|反证|失败/.test(s.title)?'red':'')+'</div><h3>'+esc(s.title)+'</h3><p>'+esc(s.summary)+'</p><p class="why">影响 · '+esc(s.why)+'</p>'+link(s.url,'原始来源')+'<button class="detail" data-detail="'+esc(s.d.id)+'">方向详情 →</button></div></article>').join('');}else{html=ds.flatMap(d=>d.papers.map(p=>({...p,d}))).sort((a,b)=>b.date.localeCompare(a.date)).map(p=>'<article class="paper-row"><div class="topline"><span class="date">'+esc(p.date)+' · '+esc(p.d.name)+'</span>'+pill(p.type,p.type==='预印本'?'amber':'')+'</div><h3>'+link(p.url,p.title)+'</h3><p>'+esc(p.contribution)+'</p><p class="limit">'+esc(p.limit)+'</p></article>').join('');}$('#content').innerHTML=html;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));}
function openDirection(id){const d=DATA.directions.find(x=>x.id===id);if(!d)return;$('#dialog-title').textContent=d.name;$('#dialog-meta').textContent=d.domain+' / '+d.stage;const block=(t,v)=>'<div class="block"><h3>'+esc(t)+'</h3><p>'+esc(v)+'</p></div>';$('#dialog-body').innerHTML=directionCompanies(d)+block('生活影响',d.impact)+block('技术原理',d.mechanism)+'<div class="twocol">'+block('已有结果',d.proven)+block('未解决问题',d.unproven)+'</div>'+block('主要问题',d.bottleneck)+block('后续关注',d.trigger)+block('反证条件',d.counter)+block('潜在变化（假设）',d.oldCategory+' → '+d.newCategory)+'<div class="block"><h3>进展记录</h3>'+d.signals.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>'<div class="source-row"><span class="date">'+esc(s.date)+' · '+esc(s.evidence)+'</span><br>'+link(s.url,s.title)+'<p>'+esc(s.summary)+'</p></div>').join('')+'</div><div class="block"><h3>论文与报告</h3>'+d.papers.map(p=>'<div class="source-row"><span class="date">'+esc(p.date)+' · '+esc(p.type)+'</span><br>'+link(p.url,p.title)+'<p>'+esc(p.contribution)+' '+esc(p.limit)+'</p></div>').join('')+'</div><span class="date">下次复核 '+esc(d.nextReview)+'</span>';$('#dialog').showModal();}
const block=(t,v)=>'<div class="block"><h3>'+esc(t)+'</h3><p>'+esc(v)+'</p></div>';
const companyButton=c=>'<a href="#company/'+esc(c.id)+'" data-company="'+esc(c.id)+'">'+esc(c.name)+'</a>';
function selectedCompanies(){return COMPANIES.filter(c=>(!state.q||JSON.stringify(c).toLowerCase().includes(state.q.toLowerCase()))&&(!state.domain||c.domain===state.domain||c.directions.some(id=>DATA.directions.find(d=>d.id===id).domain===state.domain))&&(!state.stage||c.capital.status===state.stage)&&(!state.favorites||saved.includes('company:'+c.id)));}
function starCompany(c){const on=saved.includes('company:'+c.id);return '<button class="row-save '+(on?'on':'')+'" data-save="company:'+esc(c.id)+'" aria-label="关注'+esc(c.name)+'" aria-pressed="'+on+'">'+(on?'★':'☆')+'</button>';}

let toolScope='';
function configureTools(){
 const business=state.view==='companies',scope=business?'companies':'research';

 $('#search').placeholder=business?'搜索公司、创始人、投资方…':'搜索方向、公司、创始人、投资方…';$('#checked').textContent='核查 '+(business?DATA.companyData.checkedAt:DATA.checkedAt);
 $('#coverage').textContent='研究样本截至 '+DATA.asOf;
}
const renderResearch=render;
render=function(){if(state.view==='company'){renderCompanyProfile();return;}configureTools();const business=state.view==='companies';$('h1').textContent={directions:'方向概览',companies:'公司',events:'关键进展',papers:'论文与报告',framework:'研究标准'}[state.view];$('.heading-side').innerHTML=business?'<b>'+COMPANIES.length+'</b> 家公司':'<b>'+DATA.directions.length+'</b> 个观察方向';if(!business){renderResearch();return;}$('#tools').style.display='flex';const cs=selectedCompanies();$('#content').innerHTML='<div class="list-meta"><b>公司与资本</b><span>'+cs.length+' 家 · 核查 '+esc(DATA.companyData.checkedAt)+'</span></div>'+(cs.length?companyTable(cs):'<div class="empty">没有匹配的公司</div>');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));};

function valuationCell(c){const v=c.valuation;return '<div class="cell-head">'+esc(v.amount)+'</div><div class="cell-sub">'+esc(v.basis)+(v.date?' · '+esc(v.date):'')+'</div>'+(/媒体|未确认/.test(v.status)?pill(v.status,'amber'):'');}
function directionCompanies(d){
 const registered=COMPANIES.filter(c=>c.directions.includes(d.id)),known=new Map(registered.map(c=>[c.id,c]));
 const rows=registered.map(c=>{const original=d.companies.find(x=>x.companyId===c.id);return '<div class="company-row">'+companyButton(c)+'<span>'+esc(original?original.role:c.product)+'</span></div>';});
 for(const c of d.companies)if(!known.has(c.companyId))rows.push('<div class="company-row">'+esc(c.name)+'<div class="source-links">'+link(c.url,'官网')+'</div><span>'+esc(c.role)+'</span></div>');
 return '<div class="block"><h3>公司</h3>'+rows.join('')+'</div>';
}
function renderCompanyProfile(){
 const c=COMPANIES.find(x=>x.id===state.company);if(!c)return;
 const v=c.valuation,f=c.capital;
 $('#tools').hidden=true;$('#tools').style.display='none';$('h1').textContent=c.name;
 $('.heading-side').textContent=c.domain;$('#checked').textContent='公司核查 '+DATA.companyData.checkedAt;$('#coverage').textContent='公司资料核查 '+(c.profileCheckedAt||DATA.companyData.profileCheckedAt||DATA.companyData.checkedAt);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view==='companies'));
 const funding=(c.financing||[{title:f.event,amount:f.amount,date:f.date,status:f.status,detail:f.detail,url:f.url}]).map(x=>'<article class="profile-panel"><div class="topline"><span class="date">'+esc(x.date||'日期未披露')+'</span>'+pill(x.status)+'</div><h3>'+esc(x.title)+'</h3><span class="capital-value">'+esc(x.amount)+'</span><p>'+esc(x.detail)+'</p>'+link(x.url,'披露来源')+'</article>').join('');
 const investors=c.investors?c.investors.map(i=>'<div class="profile-panel"><h3>'+esc(i.name)+'</h3><div class="cell-sub">'+esc(i.role)+' · '+esc(i.amount)+(i.date?' · '+esc(i.date):'')+'</div><p>'+esc(i.status)+'</p>'+link(i.url,'投资方来源')+'</div>').join(''):'<div class="profile-panel"><p>'+esc(f.investors)+'</p>'+link(f.url,'资本来源')+'</div>';
 const cases=(c.cases||[]).map(x=>'<article class="case-item"><h3>'+esc(x.title)+'</h3><p>'+esc(x.use)+'</p><div class="case-label">技术</div><p>'+esc(x.mechanism)+'</p><div class="case-label">已有证据</div><p>'+esc(x.evidence)+'</p><p class="gap">'+esc(x.limit)+'</p><div class="source-links">'+link(x.url,'原始来源')+(x.sources||[]).map(s=>link(s.url,s.label)).join('')+'</div></article>').join('');
 $('#content').innerHTML='<article class="profile"><div class="profile-top"><a class="quiet" href="#view/companies" data-view="companies">← 公司</a><span>'+esc(c.hq)+'</span>'+starCompany(c)+'</div><div class="profile-summary"><section class="profile-stat"><h2>'+esc(f.event)+'</h2><div class="profile-value">'+esc(f.amount)+'</div>'+pill(f.status)+'<div class="cell-sub">'+esc(f.date||'日期未披露')+'</div><p>'+esc(f.investors)+'</p>'+link(f.url,'融资来源')+'</section><section class="profile-stat"><h2>估值</h2><div class="profile-value">'+esc(v.amount)+'</div>'+pill(v.status,/媒体/.test(v.status)?'amber':'')+'<div class="cell-sub">'+esc(v.basis)+(v.date?' · '+esc(v.date):'')+'</div><p>'+esc(v.detail)+'</p>'+link(v.url,'估值来源')+'</section><section class="profile-stat"><h2>创始团队</h2><div class="profile-value founder">'+esc(c.founders)+'</div><p>'+esc(c.founderContext)+'</p>'+link(c.founderSource,'团队来源')+'</section></div>'+(cases?'<h2 class="section">产品与使用案例</h2><div class="case-grid">'+cases+'</div>':'')+'<div class="profile-grid" style="margin-top:26px"><section><h2 class="section">融资与资本变动</h2>'+funding+'</section><section><h2 class="section">投资方／资本来源</h2>'+investors+'<h2 class="section">业务进展</h2><div class="profile-panel"><h3>'+esc(c.product)+'</h3><p>'+esc(c.watch)+'</p>'+link(c.productUrl,'官网与产品')+'</div></section></div>'+(c.sources?.length?'<div class="source-links">'+c.sources.map(s=>link(s.url,s.label)).join('')+'</div>':'')+(c.directions.length?'<h2 class="section">相关方向</h2><div class="company-chips">'+c.directions.map(id=>'<button data-detail="'+esc(id)+'">'+esc(display(DATA.directions.find(d=>d.id===id)).short)+'</button>').join('')+'</div>':'')+'</article>';
}
function navigate(hash){if(location.hash===hash)route();else location.hash=hash;}
function showCompany(id,section=''){navigate('#company/'+id+(section?'/'+section:''));}
function showDetail(id){navigate('#direction/'+id);}
function route(){
 if($('#dialog').open)$('#dialog').close();
 const parts=location.hash.slice(1).split('/'),type=parts[0],id=parts[1];
 $('#tools').hidden=false;
 if(type==='company'&&COMPANIES.some(c=>c.id===id)){state.view='company';state.company=id;state.profileSection=parts[2]||'';render();}
 else if(type==='direction'&&DATA.directions.some(d=>d.id===id)){if(state.view==='company')state.view='directions';render();openDirection(id);}
 else {state.view=type==='view'&&['directions','companies','events','papers','framework','bets','risks','graph','history'].includes(id)?id:'directions';render();}
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const home=e.target.closest('[data-home-direction]');if(home){state.homeDirection=home.dataset.homeDirection;render();}const d=e.target.closest('[data-detail]');if(d){e.preventDefault();showDetail(d.dataset.detail);}const c=e.target.closest('[data-company]');if(c){e.preventDefault();showCompany(c.dataset.company,'');}const p=e.target.closest('[data-path]');if(p){state.path=state.path===p.dataset.path?'':p.dataset.path;render();}const s=e.target.closest('[data-save]');if(s){const id=s.dataset.save;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem('tech-research-follow',JSON.stringify(saved));}catch(e){}render();}const v=e.target.closest('[data-view]');if(v){e.preventDefault();navigate('#view/'+v.dataset.view);}});
$('#search').addEventListener('input',e=>{state.q=e.target.value.trim();render();});for(const k of ['domain','stage'])$('#'+k).addEventListener('change',e=>{state[k]=e.target.value;render();});
$('#favorites').onclick=()=>{state.favorites=!state.favorites;$('#favorites').setAttribute('aria-pressed',state.favorites);$('#favorites').textContent=state.favorites?'关注中 ★':'仅看关注';render();};
$('#dialog .close').onclick=()=>$('#dialog').close();$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#dialog').close();}});
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='tech-research-'+DATA.asOf+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);$('#toast').textContent='数据已导出';$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1800);};
for(const v of [...new Set([...DATA.directions.map(d=>d.domain),'当前职业参照'])]){const o=document.createElement('option');o.value=v;o.textContent=v;$('#domain').append(o);}
