<script>
'use strict';
const DATA=JSON.parse(document.getElementById('radar-data').textContent),$=s=>document.querySelector(s);
const PRESENTATION=DATA.presentation||{directions:{},readings:[]};
const COMPANIES=DATA.companyData.companies;
const PHASES=['研究原型','受控验证','限定采用','规模普及'];

const pill=(s,cls='')=>'<span class="pill '+cls+'">'+esc(s)+'</span>';

function homeCompanySearch(c){return !state.q||JSON.stringify([c.name,c.founders,c.product,c.capital,c.valuation,PRESENTATION.companies?.[c.id]]).toLowerCase().includes(state.q.toLowerCase());}

const ICONS={worlds:'<path d="m3 6 7-4 7 4v9l-7 4-7-4Z"/><path d="m3 6 7 4 7-4M10 10v9"/>',robots:'<rect x="3" y="6" width="14" height="11" rx="3"/><path d="M10 3v3M6 10h1m6 0h1M7 14h6"/>',editing:'<path d="M5 2c0 8 10 8 10 16M15 2C15 10 5 10 5 18M6 4h8M7 8h6M7 12h6M6 16h8"/>',spatial:'<path d="M2 8h16v6H2Zm0 0 2-3m14 3-2-3M8 8v6m4-6v6"/>',bci:'<path d="M6 16a5 5 0 0 1-2-9 4 4 0 0 1 6-4 4 4 0 0 1 6 4 5 5 0 0 1-2 9M10 3v15M5 9l3 2m7-2-3 2"/>',organs:'<path d="M10 6C7 0 1 4 3 10c1 4 5 7 7 8 2-1 6-4 7-8 2-6-4-10-7-4Z"/>',labs:'<path d="M7 2h6m-5 0v6l-5 8q-1 2 2 2h10q3 0 2-2l-5-8V2M6 12h8"/>',tandem:'<path d="m4 6 12 0 2 10H2Zm1 5h10M8 6l-1 10m5-10 1 10M10 2v1M3 3l1 1m12 0 1-1"/>',storage:'<rect x="3" y="4" width="13" height="13" rx="2"/><path d="M7 2h5M17 9h1v3h-1M11 7l-3 4h4l-3 4"/>',fusion:'<ellipse cx="10" cy="10" rx="8" ry="3"/><ellipse cx="10" cy="10" rx="8" ry="3" transform="rotate(60 10 10)"/><ellipse cx="10" cy="10" rx="8" ry="3" transform="rotate(120 10 10)"/>'};
function icon(id){return '<span class="direction-icon" aria-hidden="true"><svg viewBox="0 0 20 20">'+(ICONS[id]||ICONS.worlds)+'</svg></span>';}

function overview(ds){
 const order=Object.keys(PRESENTATION.directions),ordered=ds.slice().sort((a,b)=>Number(!!display(b).priority)-Number(!!display(a).priority)||order.indexOf(a.id)-order.indexOf(b.id));
 if(state.homeDirection&&!ds.some(d=>d.id===state.homeDirection))state.homeDirection='';
 const active=DATA.directions.find(d=>d.id===state.homeDirection),visible=state.homeDirection?ds.filter(d=>d.id===state.homeDirection):ds;
 const matches=c=>c.directions.some(id=>visible.some(d=>d.id===id))&&(!state.q||homeCompanySearch(c)||c.directions.some(id=>visible.some(d=>d.id===id&&(d.name.toLowerCase().includes(state.q.toLowerCase())||display(d).short.toLowerCase().includes(state.q.toLowerCase())))))&&(!state.favorites||saved.includes('company:'+c.id)||c.directions.some(id=>saved.includes(id)));
 const cs=COMPANIES.filter(matches).sort((a,b)=>Math.min(...a.directions.map(id=>ordered.findIndex(d=>d.id===id)).filter(i=>i>=0))-Math.min(...b.directions.map(id=>ordered.findIndex(d=>d.id===id)).filter(i=>i>=0)));
 const rail=ordered.map(d=>{const pr=display(d);return '<div class="direction-switch '+(d.id===state.homeDirection?'selected':'')+'"><button class="direction-pick" data-home-direction="'+esc(d.id)+'" aria-label="筛选'+esc(pr.short)+'公司" aria-pressed="'+(d.id===state.homeDirection)+'"><span class="rail-name">'+icon(d.id)+esc(pr.short)+(pr.priority?'<i class="priority-dot" title="优先研究"></i>':'')+'</span><span class="rail-stage">'+esc(d.stage)+'</span><span class="mini-track" role="img" aria-label="'+esc(pr.short)+'：'+PHASES[pr.checkpoint]+'" title="'+PHASES.join(' → ')+'">'+PHASES.map((s,i)=>'<i class="'+(i<pr.checkpoint?'done':i===pr.checkpoint?'current':'')+'"></i>').join('')+'</span></button><button class="rail-detail" data-detail="'+esc(d.id)+'" aria-label="查看'+esc(pr.short)+'技术详情">↗</button></div>';}).join('');
 const rows=cs.map(c=>{const s=PRESENTATION.companies?.[c.id]||{founders:c.founders,round:c.capital.event,investors:c.capital.investors},v=c.valuation;return '<tr><td><div class="home-company-name">'+companyButton(c)+starCompany(c)+'</div><div class="cell-sub">'+c.directions.map(id=>esc(display(DATA.directions.find(d=>d.id===id)).short)).join(' · ')+'</div></td><td title="'+esc(c.founders)+'">'+esc(s.founders)+'</td><td><a class="home-value '+(/媒体/.test(v.status)?'reported':'')+'" href="'+esc(v.url)+'" target="_blank" rel="noopener noreferrer">'+esc(v.amount)+'</a><div class="cell-sub">'+esc(v.basis)+'</div>'+(/媒体|未确认/.test(v.status)?'<div class="valuation-state">'+esc(v.status)+'</div>':'')+(v.date?'<time>'+esc(v.date)+'</time>':'')+'</td><td><strong>'+esc(s.round)+'</strong><div class="cell-sub">'+esc(c.capital.amount)+'</div>'+(s.roundNote?'<div class="cell-sub">'+esc(s.roundNote)+'</div>':'')+(s.dateLabel||c.capital.date?'<time>'+esc(s.dateLabel||c.capital.date)+'</time>':'')+'</td><td>'+esc(s.investors)+(s.investorNote?'<div class="cell-sub">'+esc(s.investorNote)+'</div>':'')+'</td></tr>';}).join('');
 const readings=PRESENTATION.readings.filter(r=>visible.some(d=>d.id===r.direction));
 return homeOdds()+'<div class="home-dashboard"><aside class="direction-rail"><div class="panel-top"><h2>方向与阶段</h2><button class="home-reset '+(!active?'active':'')+'" data-home-direction="" aria-pressed="'+!active+'">全部</button></div><div class="rail-axis"><span>方向</span><span title="'+PHASES.join(' → ')+'">研究 · 验证 · 使用 · 普及</span></div>'+rail+'<div class="rail-foot"><span>技术核查 '+esc(DATA.checkedAt)+'</span><button data-view="framework">研究标准 ↗</button></div></aside><div class="home-main"><div class="panel-top"><h2>'+(active?esc(display(active).short)+' · ':'')+'公司<span class="section-count">'+cs.length+'</span></h2><span class="home-date">公司核查 '+esc(DATA.companyData.checkedAt)+'</span></div><div class="home-table-scroll"><table class="home-company-table"><thead><tr><th>公司</th><th>创始人</th><th>估值</th><th>轮次／资本节点</th><th>核心投资方</th></tr></thead><tbody>'+rows+'</tbody></table>'+(!cs.length?'<div class="empty">暂无对应公司</div>':'')+'</div></div></div>'+(readings.length?'<section class="home-readings"><h2>数据</h2><div>'+readings.map(r=>'<button data-detail="'+esc(r.direction)+'" aria-label="查看'+esc(r.label)+'详情"><span class="home-reading-value">'+esc(r.value)+'<small>'+esc(r.unit)+'</small></span><span><strong>'+esc(r.label)+'</strong><span class="cell-sub">'+esc(r.context)+' · '+esc(r.date)+'</span></span></button>').join('')+'</div></section>':'');
}

/* odds-v1: subjective evidence scenarios, not calibrated probabilities. */
const ResearchModel=(()=>{
 const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
 const logit=p=>Math.log(p/(1-p)),sigmoid=x=>1/(1+Math.exp(-x));
 function probability(scores,{prior=.2,dependence=.65}={}){if(!(prior>0&&prior<1))throw Error('prior');if(scores.length!==5||scores.some(s=>!Number.isFinite(s)||s< -2||s>2))throw Error('scores');return sigmoid(logit(prior)+dependence*Math.LN2*scores.reduce((a,b)=>a+b,0));}
 function estimate(scores,settings={}){const center=probability(scores,settings),values=[];for(const prior of [.1,.35])for(const dependence of [.4,.8])for(const delta of [-.5,.5])values.push(probability(scores.map(s=>clamp(s+delta,-2,2)),{prior,dependence}));return{p:center,low:Math.min(...values,center),high:Math.max(...values,center)};}
 function brier(p,outcome){if(!(p>=0&&p<=1)||![0,1].includes(outcome))throw Error('settlement');return(p-outcome)**2;}
 function available(evidence,cutoff){return evidence.filter(e=>e.date&&e.date<=cutoff&&(!e.sources||e.sources.every(s=>s.date&&s.date<=cutoff)));}
 function assertCutoff(evidence,cutoff){if(available(evidence,cutoff).length!==evidence.length)throw Error('lookahead evidence');return true;}
 function edgesAt(edges,date,clock='recordedAt'){return edges.filter(e=>e[clock]<=date&&(!e.validTo||e.validTo>date));}
 return{probability,estimate,brier,available,assertCutoff,edgesAt};
})();

 const t=themes.find(t=>t.id===hierarchyState.theme)||themes[0];hierarchyState.theme=t.id;
 let cs=themeCompanies(t);if(q&&cs.some(homeCompanySearch))cs=cs.filter(homeCompanySearch);if(state.favorites)cs=cs.filter(c=>saved.includes('company:'+c.id)||c.directions.some(id=>saved.includes(id)));
 const rail=['生活与工作','基础设施'].map(kind=>{const ts=themes.filter(t=>t.kind===kind);return ts.length?'<div class="theme-group-label">'+kind+'</div>'+ts.map(th=>'<button class="theme-pick" data-theme="'+th.id+'" aria-pressed="'+(th.id===t.id)+'"><strong>'+esc(th.name)+'</strong><span>'+esc(th.adoption)+'</span></button>').join(''):'';}).join('');
 const paths=t.products.map(id=>{const p=themeProduct(id);return '<div class="product-path"><span>'+esc(p.name)+'</span><span>→</span><div class="company-chips">'+p.directions.map(techButton).join('')+'</div></div>';}).join('');
 return '<div class="theme-layout"><aside class="theme-rail" aria-label="变化主线">'+rail+'</aside><section class="theme-content"><div class="theme-title"><h2>'+esc(t.name)+'</h2><button class="quiet" data-theme-bets="'+t.id+'">查看赌注 ↗</button></div><p class="theme-question" title="'+esc(t.question)+'">'+esc(t.change)+'</p><div class="theme-observation"><span>已有证据</span><div>'+t.evidence.map(hierarchyEvidence).join('')+'</div><span>下一证据</span><p>'+esc(t.next)+'</p></div><div class="theme-section-title"><h3>产品与服务 → 技术路线</h3><span title="研究归类；点击技术查看原始证据">'+t.directions.length+' 项技术</span></div>'+paths+'<div class="theme-section-title"><h3>公司 <small>'+cs.length+'</small></h3><span>核查 '+DATA.companyData.checkedAt+'</span></div><div class="home-table-scroll theme-companies"><table class="home-company-table"><thead><tr><th>公司</th><th>创始人</th><th>估值</th><th>轮次／资本节点</th><th>核心投资方</th></tr></thead><tbody>'+hierarchyCompanyRows(cs)+'</tbody></table>'+(!cs.length?'<div class="theme-empty">暂无匹配公司</div>':'')+'</div></section></div>';
}
function hierarchyBetRow(b){
 const e=ResearchModel.estimate(betScores(b),{prior:b.prior}),mine=forecastJournal.filter(r=>r.bet===b.id&&r.lens===systemState.lens).at(-1);
 return '<div class="forecast-row"><button class="forecast-question" data-bet="'+b.id+'"><strong>'+esc(b.name)+'</strong><span>'+esc(betEvent(b))+'</span></button><div>'+oddsChart(e)+'<div class="odds-caption">'+pct(e.low)+'–'+pct(e.high)+' · 假设范围</div></div><div class="forecast-percent">'+pct(e.p)+'<span>'+(mine?'我的判断 '+pct(mine.p):'尚未记录个人判断')+'</span></div><button class="quiet" data-bet="'+b.id+'">查看／记录</button></div>';
}
betsView=function(){
 const consumer=systemState.lens==='consumer',themes=HIERARCHY.themes.filter(t=>!hierarchyState.betTheme||t.id===hierarchyState.betTheme);
 const groups=themes.map(t=>({t,bets:SYS.bets.filter(b=>t.primaryDirections.includes(b.direction)&&betScores(b))})).filter(g=>g.bets.length);
 const head='<div class="forecast-head"><span>截至2036-12-31的具体事件</span><span class="axis"><i>0</i><i>25</i><i>50</i><i>75</i><i>100%</i></span><span>事件概率</span><span>记录</span></div>';
 const milestones=SYS.milestones.filter(m=>themes.some(t=>t.primaryDirections.includes(m.parent)));
 return '<div class="system-top"><select id="bet-theme" class="bet-theme-select" aria-label="赌注主线"><option value="">全部主线</option>'+HIERARCHY.themes.map(t=>'<option value="'+t.id+'" '+(hierarchyState.betTheme===t.id?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select><div class="segmented"><button data-lens="industry" aria-pressed="'+!consumer+'">具体应用</button><button data-lens="consumer" aria-pressed="'+consumer+'">大众直接使用</button></div><span class="model-status" title="人工参数与打分；各行对应不同事件。">人工假设 · 未校准</span><button class="quiet" data-method>算法与验证</button></div>'+groups.map(({t,bets})=>'<section class="bet-theme-group"><div class="bet-group-heading"><h2>'+esc(t.name)+'</h2><span>'+esc(t.kind)+'</span><button data-theme="'+t.id+'">主线与公司 ↗</button></div>'+head+bets.map(hierarchyBetRow).join('')+'</section>').join('')+(!groups.length?'<div class="theme-empty">该主线按实际服务、治疗或供电规模观察。<button class="quiet" data-lens="industry">查看具体应用</button></div>':'')+(milestones.length?'<h2 class="system-section">短期节点</h2><div class="milestones">'+milestones.map(m=>{const e=ResearchModel.estimate(m.scores,{prior:m.prior});return '<button data-milestone="'+m.id+'"><span>'+esc(m.name)+'</span><strong>'+pct(e.p)+'</strong><time>'+esc(m.deadline)+'</time></button>';}).join('')+'</div>':'')+'<div class="system-top" style="margin-top:26px"><h2>判断记录 <small>'+forecastJournal.length+'</small></h2><button class="quiet" data-export-forecasts>导出记录 ↓</button></div>'+journalView();
};
const technicalGraphView=graphView;
graphView=function(){
 const snap=SYS.snapshots.find(s=>s.id===systemState.graphSnapshot)||SYS.snapshots.at(-1),h=snap.hierarchy;
 const paths=h?h.themes.filter(t=>t.directions.includes(systemState.graphFocus)).map(t=>'<div class="theme-breadcrumb"><button data-theme="'+esc(t.id)+'">'+esc(t.name)+'</button><span>→</span><span>'+t.products.map(id=>h.products.find(p=>p.id===id)).filter(p=>p.directions.includes(systemState.graphFocus)).map(p=>esc(p.name)).join(' / ')+'</span><span>→</span><strong>'+esc(DATA.directions.find(d=>d.id===systemState.graphFocus).name)+'</strong></div>').join(''):'';
 return (h?'<div class="graph-lineage"><span>主线 → 产品与服务 → 技术路线 · 研究归类 '+esc(h.reviewedAt)+'</span>'+paths+'</div>':'')+technicalGraphView();
};
const technicalOpenDirection=openDirection;
openDirection=function(id){technicalOpenDirection(id);const t=themeForDirection(id);if(t)$('#dialog-meta').textContent=t.name+' / 技术路线 / '+DATA.directions.find(d=>d.id===id).stage;};
const hierarchyPreviousRender=render;
render=function(){
 $('#domain').hidden=false;$('#stage').hidden=false;
 if(state.view==='directions'){
  configureTools();$('#tools').hidden=false;$('#tools').style.display='flex';$('#domain').hidden=true;$('#stage').hidden=true;$('#search').placeholder='搜索主线、技术、公司、创始人、投资方…';
  $('h1').textContent='变化主线';$('.heading-side').textContent='4 条生活与工作主线 / 1 条基础设施 / 10 项技术';$('#checked').textContent='结构更新 '+HIERARCHY.reviewedAt;$('#coverage').textContent='技术核查 '+DATA.checkedAt+' · 公司核查 '+DATA.companyData.checkedAt;
  $('#content').innerHTML=hierarchyHome();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view==='directions'));return;
 }
 hierarchyPreviousRender();
 if(state.view==='company'){
  const c=COMPANIES.find(c=>c.id===state.company),themes=HIERARCHY.themes.filter(t=>c.directions.some(id=>t.directions.includes(id)));
  if(themes.length)$('#content').insertAdjacentHTML('afterbegin','<div class="theme-breadcrumb"><span>相关主线</span>'+themes.map(t=>'<button data-theme="'+t.id+'">'+esc(t.name)+'</button>').join('')+'</div>');
 }
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-theme]');if(t){hierarchyState.theme=t.dataset.theme;if(state.view!=='directions'){state.q='';$('#search').value='';state.favorites=false;$('#favorites').setAttribute('aria-pressed','false');$('#favorites').textContent='仅看关注';}navigate('#view/directions');}
 const b=e.target.closest('[data-theme-bets]');if(b){hierarchyState.betTheme=b.dataset.themeBets;systemState.lens='industry';navigate('#view/bets');}
});
document.addEventListener('change',e=>{if(e.target.id==='bet-theme'){hierarchyState.betTheme=e.target.value;render();}});

$('#count').textContent=DATA.directions.length;$('#priority-count').textContent=DATA.directions.filter(d=>display(d).priority).length;$('#sources').textContent=new Set(DATA.directions.flatMap(d=>[...d.signals,...d.papers].map(s=>s.url))).size;$('#paper-count').textContent=DATA.directions.reduce((n,d)=>n+d.papers.length,0);$('#checked').textContent='核查 '+DATA.checkedAt;$('#schedule').textContent=DATA.schedule;$('#coverage').textContent='证据截至 '+DATA.asOf;route();
const allSources=DATA.directions.flatMap(d=>[...d.signals,...d.papers].map(s=>s.url)).concat(COMPANIES.flatMap(c=>[c.founderSource,c.capital.url,c.productUrl,c.valuation.url,...(c.investors||[]).map(i=>i.url),...(c.financing||[]).map(f=>f.url),...(c.cases||[]).flatMap(x=>[x.url,...(x.sources||[]).map(s=>s.url)]),...(c.sources||[]).map(s=>s.url)]),SYS.sources.map(s=>s.url));$('#sources').textContent=new Set(allSources).size;
</script>
</body></html>
